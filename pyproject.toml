[project]
name = "log-triage-agent"
version = "0.1.0"
description = "AI agent that triages production errors from Azure App Insights and publishes deduplicated issues to data-altinn-no/core"
readme = "README.md"
requires-python = ">=3.11"
# Keep in sync with requirements.txt; requirements.lock.txt holds the resolved set.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "httpx>=0.27,<1.0",
    "PyGithub>=2.4,<3.0",
    "langgraph>=1.0,<2.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langfuse>=3.0,<4.0",
    "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt and issue-body text. Reflowing these literals changes what the model
# reads and what gets rendered into a GitHub issue, so the line-length rule is
# the wrong tool here.
"agents/prompts/*.py" = ["E501"]
"agents/graph/nodes/publish.py" = ["E501"]
