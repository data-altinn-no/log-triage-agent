name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # The lock file is what the image installs, so test against it.
      - run: pip install -r requirements.lock.txt pytest pytest-asyncio ruff

      - run: ruff check .

      - run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      REGISTRY: containerregnadobe-bmg4dvcsf6h3edb0.azurecr.io
      RESOURCE_GROUP: rg-nadobe-ops
      CONTAINER_APP: containerapp-log-triage-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The identity the portal created when continuous deployment was set up.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.CONTAINERAPPLOGTRIAGEAGENT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERAPPLOGTRIAGEAGENT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERAPPLOGTRIAGEAGENT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          image="$REGISTRY/log-triage-agent:${{ github.sha }}"
          # The login server carries a hash suffix, so the registry name has to be looked up.
          name=$(az acr list -g "$RESOURCE_GROUP" --query "[?loginServer=='$REGISTRY'].name" -o tsv)
          az acr login -n "$name"
          docker build -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --image "$IMAGE" --output none

      - name: Wait for the new revision
        run: |
          app=(-g "$RESOURCE_GROUP" -n "$CONTAINER_APP")
          for _ in $(seq 1 30); do
            read -r latest ready fqdn < <(az containerapp show "${app[@]}" --query \
              "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.configuration.ingress.fqdn]" -o tsv | tr '\n' ' ')
            if [ "$latest" = "$ready" ] && curl -fsS "https://$fqdn/health"; then
              echo; echo "$latest is serving"; exit 0
            fi
            sleep 10
          done
          echo "$latest did not become ready within 5 minutes" >&2
          exit 1
