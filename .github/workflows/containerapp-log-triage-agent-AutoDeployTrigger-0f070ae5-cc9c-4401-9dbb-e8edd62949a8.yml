name: Trigger auto deployment for containerapp-log-triage-agent

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/containerapp-log-triage-agent-AutoDeployTrigger-0f070ae5-cc9c-4401-9dbb-e8edd62949a8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTAINERAPPLOGTRIAGEAGENT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERAPPLOGTRIAGEAGENT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERAPPLOGTRIAGEAGENT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: containerregnadobe-bmg4dvcsf6h3edb0.azurecr.io
          registryUsername: ${{ secrets.CONTAINERAPPLOGTRIAGEAGENT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERAPPLOGTRIAGEAGENT_REGISTRY_PASSWORD }}
          containerAppName: containerapp-log-triage-agent
          resourceGroup: rg-nadobe-ops
          imageToBuild: containerregnadobe-bmg4dvcsf6h3edb0.azurecr.io/containerapp-log-triage-agent:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


